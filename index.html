<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkTasker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #d9d9d9;
      color: #333;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone {
      width: 390px;
      height: 780px;
      background: #fff;
      border: 12px solid #333;
      border-radius: 36px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
    }

    .tab-bar {
      display: flex;
      border-top: 1px solid #ccc;
      background: #f2f2f2;
    }

    .tab-bar button {
      flex: 1;
      padding: 14px 0;
      border: none;
      background: none;
      font-size: 14px;
      color: #777;
      cursor: pointer;
    }

    .tab-bar button.active {
      color: #222;
      font-weight: 600;
    }

    .header {
      display: flex;
      align-items: center;
      height: 64px;
      flex-shrink: 0;
      padding: 0 16px;
      border-bottom: 1px solid #ddd;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .header .back-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      border: none;
      background: none;
      font-size: 15px;
      color: #555;
      cursor: pointer;
      padding: 0 12px 0 0;
    }

    .header .back-btn .chevron {
      color: #999;
      font-size: 18px;
    }

    .header .add-btn {
      border: 1px solid #bbb;
      background: #f5f5f5;
      border-radius: 6px;
      width: 36px;
      height: 36px;
      font-size: 20px;
      color: #444;
      cursor: pointer;
    }

    .content {
      padding: 16px;
    }

    .task-list {
      list-style: none;
    }

    .task-row {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .task-row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 14px;
    }

    .task-row .task-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .task-row .task-title {
      font-size: 15px;
    }

    .task-row .task-title.done {
      text-decoration: line-through;
    }

    .task-row .task-due-time {
      font-size: 13px;
      color: #888;
    }

    .task-row .task-priority {
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .task-row .task-priority.priority-low {
      color: #2f7a3d;
      background: #dff0e2;
    }

    .task-row .task-priority.priority-medium {
      color: #96650a;
      background: #fdecc8;
    }

    .task-row .task-priority.priority-high {
      color: #a92f27;
      background: #fbe0de;
    }

    .group-header {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px 6px;
      background: #fafafa;
    }

    .group-header.overdue {
      color: #fff;
      background: #c0392b;
    }

    .group-header.due-today {
      color: #fff;
      background: #d98c00;
    }

    .detail-field {
      margin-bottom: 18px;
    }

    .detail-field .label {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
    }

    .detail-field .value {
      font-size: 15px;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 16px;
      border: 1px solid #bbb;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 15px;
      color: #333;
      cursor: pointer;
    }

    .btn.full {
      width: 100%;
      margin-top: 10px;
    }

    .form-field {
      margin-bottom: 16px;
    }

    .form-field label {
      display: block;
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }

    .form-field input[type="text"],
    .form-field input[type="datetime-local"],
    .form-field textarea,
    .form-field select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
      color: #333;
    }

    .form-field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #666;
      margin: 24px auto 12px;
    }

    .profile-name {
      text-align: center;
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .settings-list {
      list-style: none;
      border-top: 1px solid #eee;
    }

    .settings-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      font-size: 15px;
      color: #444;
    }

    .settings-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      color: inherit;
      text-decoration: none;
    }

    .settings-list .chevron {
      color: #999;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen" id="screen"></div>
    <div class="tab-bar" id="tab-bar">
      <button data-tab="tasks">My Tasks</button>
      <button data-tab="profile">Profile</button>
    </div>
  </div>

  <script>
    var state = {
      tasks: [
        { id: 't1', title: 'Order safety signage for site entry', description: 'Need two new signs for the east gate.', priority: 'medium', status: 'todo', dueDate: '2026-08-02T09:00' },
        { id: 't2', title: 'Book scissor lift inspection', description: 'Annual inspection is due. Call the hire company.', priority: 'high', status: 'todo', dueDate: '2026-07-28T10:00' },
        { id: 't3', title: 'Update site induction slides', description: '', priority: 'low', status: 'done' },
        { id: 't4', title: 'Chase concrete pour schedule', description: 'Confirm slab pour with the subcontractor.', priority: 'high', status: 'todo', dueDate: '2026-08-10T14:00' },
        { id: 't5', title: 'File weekly toolbox talk notes', description: 'Scan and file the signed attendance sheet.', priority: 'low', status: 'done' },
        { id: 't6', title: 'Replace broken first aid kit stock', description: 'Bandages and eye wash are running low.', priority: 'medium', status: 'todo' },
        { id: 't7', title: 'Review scaffold handover checklist', description: '', priority: 'medium', status: 'todo', dueDate: '2026-08-05T08:00' },
        { id: 't8', title: 'Send timesheets to payroll', description: 'Last week\'s timesheets from the crew.', priority: 'high', status: 'done' }
      ],
      activeTab: 'tasks',
      currentScreen: 'tasks',
      editingTaskId: null,
      nextId: 9
    };

    var screenEl = document.getElementById('screen');
    var tabBarEl = document.getElementById('tab-bar');

    function findTask(id) {
      for (var i = 0; i < state.tasks.length; i++) {
        if (state.tasks[i].id === id) return state.tasks[i];
      }
      return null;
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function compareTasks(a, b) {
      if (a.status !== b.status) {
        return a.status === 'done' ? 1 : -1;
      }
      if (a.status === 'done') return 0;
      if (a.dueDate && b.dueDate) {
        return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
      }
      if (a.dueDate && !b.dueDate) return -1;
      if (!a.dueDate && b.dueDate) return 1;
      return 0;
    }

    function startOfDay(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function formatDueTime(dueDate) {
      return new Date(dueDate).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    function formatDueDateTime(dueDate) {
      var d = new Date(dueDate);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ', ' + formatDueTime(dueDate);
    }

    function render() {
      tabBarEl.style.display = state.currentScreen === 'form' ? 'none' : 'flex';

      var buttons = tabBarEl.querySelectorAll('button');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].className = buttons[i].dataset.tab === state.activeTab ? 'active' : '';
      }

      if (state.currentScreen === 'tasks') renderTasks();
      else if (state.currentScreen === 'profile') renderProfile();
      else if (state.currentScreen === 'form') renderTaskForm();
    }

    function renderTaskRow(t, showDate) {
      var dueLineHtml = '';
      if (t.status !== 'done' && t.dueDate) {
        var dueText = showDate ? formatDueDateTime(t.dueDate) : formatDueTime(t.dueDate);
        dueLineHtml = '<span class="task-due-time">' + dueText + '</span>';
      }
      return (
        '<li class="task-row" data-id="' + t.id + '">' +
          '<input type="checkbox" data-id="' + t.id + '"' + (t.status === 'done' ? ' checked' : '') + '>' +
          '<div class="task-main">' +
            '<span class="task-title' + (t.status === 'done' ? ' done' : '') + '">' + escapeHtml(t.title) + '</span>' +
            dueLineHtml +
          '</div>' +
          '<span class="task-priority priority-' + t.priority + '">' + t.priority + '</span>' +
        '</li>'
      );
    }

    function renderTaskGroup(title, tasks, headerClass, showDate) {
      if (!tasks.length) return '';
      var classAttr = 'group-header' + (headerClass ? ' ' + headerClass : '');
      var rows = tasks.map(function (t) { return renderTaskRow(t, showDate); }).join('');
      return (
        '<div class="' + classAttr + '">' + title + '</div>' +
        '<ul class="task-list">' + rows + '</ul>'
      );
    }

    function renderTasks() {
      var today = startOfDay(new Date());
      var tomorrow = new Date(today);
      tomorrow.setDate(today.getDate() + 1);
      var endOfWeek = new Date(today);
      endOfWeek.setDate(today.getDate() + ((7 - today.getDay()) % 7));

      var doneTasks = [];
      var overdueTasks = [];
      var dueTodayTasks = [];
      var tomorrowTasks = [];
      var thisWeekTasks = [];
      var upcomingTasks = [];
      var noDateTasks = [];

      state.tasks.forEach(function (t) {
        if (t.status === 'done') {
          doneTasks.push(t);
          return;
        }
        if (!t.dueDate) {
          noDateTasks.push(t);
          return;
        }
        var dueDay = startOfDay(new Date(t.dueDate));
        if (dueDay < today) {
          overdueTasks.push(t);
        } else if (dueDay.getTime() === today.getTime()) {
          dueTodayTasks.push(t);
        } else if (dueDay.getTime() === tomorrow.getTime()) {
          tomorrowTasks.push(t);
        } else if (dueDay <= endOfWeek) {
          thisWeekTasks.push(t);
        } else {
          upcomingTasks.push(t);
        }
      });

      [overdueTasks, dueTodayTasks, tomorrowTasks, thisWeekTasks, upcomingTasks, noDateTasks].forEach(function (list) {
        list.sort(compareTasks);
      });

      var groupsHtml =
        renderTaskGroup('Overdue', overdueTasks, 'overdue', true) +
        renderTaskGroup('Due today', dueTodayTasks, 'due-today', false) +
        renderTaskGroup('Tomorrow', tomorrowTasks, null, false) +
        renderTaskGroup('This week', thisWeekTasks, null, true) +
        renderTaskGroup('Upcoming', upcomingTasks, null, true) +
        renderTaskGroup('No due date', noDateTasks, null, false) +
        renderTaskGroup('Done', doneTasks, null, false);

      screenEl.innerHTML =
        '<div class="header"><h1>My Tasks</h1><button class="add-btn" id="add-task-btn">+</button></div>' +
        groupsHtml;

      document.getElementById('add-task-btn').addEventListener('click', function () {
        state.editingTaskId = null;
        state.currentScreen = 'form';
        render();
      });

      var rowEls = screenEl.querySelectorAll('.task-row');
      for (var i = 0; i < rowEls.length; i++) {
        rowEls[i].addEventListener('click', function (e) {
          if (e.target.type === 'checkbox') return;
          state.editingTaskId = this.dataset.id;
          state.currentScreen = 'form';
          render();
        });
      }

      var checkboxes = screenEl.querySelectorAll('input[type="checkbox"]');
      for (var j = 0; j < checkboxes.length; j++) {
        checkboxes[j].addEventListener('change', function () {
          var task = findTask(this.dataset.id);
          task.status = this.checked ? 'done' : 'todo';
          render();
        });
      }
    }

    function renderProfile() {
      screenEl.innerHTML =
        '<div class="header"><h1>Profile</h1></div>' +
        '<div class="avatar">AS</div>' +
        '<div class="profile-name">Alex Smith</div>' +
        '<ul class="settings-list">' +
          '<li><a href="https://github.com/sammcdonnell/worktasker" target="_blank">About<span class="chevron">&rsaquo;</span></a></li>' +
          '<li>Log out<span class="chevron">&rsaquo;</span></li>' +
        '</ul>';
    }

    function renderTaskForm() {
      var editing = state.editingTaskId ? findTask(state.editingTaskId) : null;

      screenEl.innerHTML =
        '<div class="header">' +
          '<button class="back-btn" id="back-btn"><span class="chevron">&lsaquo;</span>Back</button>' +
          '<h1></h1>' +
        '</div>' +
        '<div class="content">' +
          '<div class="form-field">' +
            '<label for="field-title">Title</label>' +
            '<input type="text" id="field-title" value="' + (editing ? escapeHtml(editing.title) : '') + '">' +
          '</div>' +
          '<div class="form-field">' +
            '<label for="field-description">Description</label>' +
            '<textarea id="field-description">' + (editing ? escapeHtml(editing.description) : '') + '</textarea>' +
          '</div>' +
          '<div class="form-field">' +
            '<label for="field-priority">Priority</label>' +
            '<select id="field-priority">' +
              '<option value="low">low</option>' +
              '<option value="medium">medium</option>' +
              '<option value="high">high</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-field">' +
            '<label for="field-duedate">Due date</label>' +
            '<input type="datetime-local" id="field-duedate" value="' + (editing && editing.dueDate ? editing.dueDate : '') + '">' +
          '</div>' +
          '<button class="btn full" id="submit-btn">Save</button>' +
          (editing ?
            '<button class="btn full" id="toggle-btn">' + (editing.status === 'done' ? 'Mark as to-do' : 'Mark as done') + '</button>' +
            '<button class="btn full" id="delete-btn">Delete</button>'
          : '') +
        '</div>';

      if (editing) {
        document.getElementById('field-priority').value = editing.priority;
      } else {
        document.getElementById('field-priority').value = 'medium';
      }

      document.getElementById('back-btn').addEventListener('click', function () {
        state.editingTaskId = null;
        state.currentScreen = 'tasks';
        render();
      });

      if (editing) {
        document.getElementById('toggle-btn').addEventListener('click', function () {
          editing.status = editing.status === 'done' ? 'todo' : 'done';
          this.textContent = editing.status === 'done' ? 'Mark as to-do' : 'Mark as done';
        });

        document.getElementById('delete-btn').addEventListener('click', function () {
          state.tasks = state.tasks.filter(function (t) { return t.id !== editing.id; });
          state.editingTaskId = null;
          state.currentScreen = 'tasks';
          render();
        });
      }

      document.getElementById('submit-btn').addEventListener('click', function () {
        var title = document.getElementById('field-title').value.trim();
        if (!title) {
          document.getElementById('field-title').focus();
          return;
        }
        var description = document.getElementById('field-description').value.trim();
        var priority = document.getElementById('field-priority').value;
        var dueDate = document.getElementById('field-duedate').value;

        if (editing) {
          editing.title = title;
          editing.description = description;
          editing.priority = priority;
          editing.dueDate = dueDate;
        } else {
          state.tasks.push({
            id: 't' + state.nextId,
            title: title,
            description: description,
            priority: priority,
            status: 'todo',
            dueDate: dueDate
          });
          state.nextId++;
        }

        state.editingTaskId = null;
        state.currentScreen = 'tasks';
        render();
      });
    }

    tabBarEl.addEventListener('click', function (e) {
      var tab = e.target.dataset.tab;
      if (!tab) return;
      state.activeTab = tab;
      state.currentScreen = tab;
      render();
    });

    render();
  </script>
</body>
</html>
